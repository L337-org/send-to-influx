name: 'Announce pull requests'

# Announces pull requests to Slack through the shared announcer, whose README says which ones it
# posts (CONTRIBUTING.md, "Slack notifications").
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  slack:
    name: Announce to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-pull-request.yaml@v2
    with:
      channel: '#send-to-influx'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
