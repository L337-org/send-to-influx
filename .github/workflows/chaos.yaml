name: 'Chaos run'
permissions:
  contents: read

# Two lengths of the same run. Every pull request gets a short one, so a change that breaks what
# it checks - an interaction between several controls, a bridge and a database under randomly
# chosen faults - is caught before it merges rather than the morning after. Main gets a long one
# nightly, because some interactions only turn up after thousands of ticks. Any seed that has
# *failed* also runs with the ordinary suite, so a finding is never waiting on this job again.
on:
  pull_request:
  schedule:
    # 03:17 UTC daily. Not on the hour, because every scheduled job in the world is.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed to reproduce a previous run; random when empty'
        required: false
        type: string
      ticks:
        description: 'How many ticks to drive'
        required: false
        default: '300'
        type: string
      writer_seconds:
        description: 'How long the writer stress run submits for, in seconds'
        required: false
        default: '20'
        type: string

# One group per pull request, so pull requests do not queue behind each other or cancel each
# other: GitHub keeps only one pending run per group. A newer push supersedes a pull request's
# run; the nightly run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  chaos:
    runs-on: [ubuntu-latest]
    name: Seeded chaos run
    # 300 ticks is about a minute of real processes and 3000 about eight to twelve, and the writer
    # stress run adds 20 seconds on a pull request and fifteen minutes nightly, plus its drain. The
    # ceiling is for a run that wedges rather than for one that is merely long.
    timeout-minutes: 60
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the chaos scenarios
        env:
          CHAOS_SEED: ${{ inputs.seed }}
          # A dispatch says how long; a pull request gets the short run; the nightly run the long one.
          CHAOS_TICKS: ${{ inputs.ticks || (github.event_name == 'pull_request' && '300') || '3000' }}
          # The writer under load and random outages (tests/chaos/test_writer_stress.py): long
          # enough on a pull request to see several outages and recoveries, and long nightly.
          WRITER_STRESS_SECONDS: ${{ inputs.writer_seconds || (github.event_name == 'pull_request' && '20') || '900' }}
        # -s so the seed is in the log of a run that passed as well as one that failed: the
        # seed of a run nobody can repeat is worth nothing, and a green run whose seed is
        # only in captured output is a run nobody can repeat.
        run: pytest -m chaos -s
