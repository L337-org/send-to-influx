name: 'Check inbound changes'
permissions:
  contents: read

# Triggers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Jobs
jobs:

  repo-hygiene:
    # Conventions every repository in this organisation shares, checked by the one copy in the
    # shared workflows repository at the commit pinned here.
    runs-on: [ubuntu-latest]
    name: Repository hygiene
    # The shared action installs uv, then runs a git listing, a YAML parse and some regexes.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository conventions hold
        uses: L337-org/github-workflows/actions/repo-hygiene@c406e0fddc7d1212c17979cfb667c7cb5d97a6a5 # v1.3.0

  action-pins:
    # Every `uses:` names a full commit SHA, checked by the shared copy pinned here.  release.yaml
    # runs at `contents: write` with GITHUB_TOKEN available when it attaches the .deb, so a
    # repointed tag would run inside the publishing step next to a write-scoped token.
    runs-on: [ubuntu-latest]
    name: Action pins are immutable
    # The shared action is a grep over the workflow files.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every `uses:` must name a 40-hex commit SHA
        uses: L337-org/github-workflows/actions/action-pins@c406e0fddc7d1212c17979cfb667c7cb5d97a6a5 # v1.3.0

  pytest-run:
    runs-on: [ubuntu-latest]
    name: Run pytest
    # 47s observed max across the 3.10-3.14 matrix.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: pytest -v --cov=toinflux --cov=sendtoinflux --cov-report=term-missing

  integration-run:
    # Runs the marked integration tests (excluded from the default pytest run above)
    # against a real MQTT broker and a real InfluxDB started on the runner. A required check
    # on main's ruleset (a failure blocks merging), so the streaming path and the writer are
    # exercised against the real things on every PR.
    #
    # The name says nothing about which services, so adding one does not make it wrong. It is a
    # required status check in main's ruleset, which names it: renaming it means changing the
    # ruleset too.
    runs-on: [ubuntu-latest]
    name: Run integration tests
    # 148s observed max with the broker alone; the InfluxDB image pull adds to that.
    timeout-minutes: 20
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Runs the broker as a container rather than installing it with apt. The apt route
      # wedged a run for 12+ minutes on `apt-get update` against an unresponsive mirror, with
      # nothing to stop it: the readiness loop below is bounded, but the install above it was
      # not, so the job would have burned to the 6-hour default limit on an infrastructure
      # problem unrelated to the change under test. Docker is preinstalled on the runner and
      # the image is registry-cached, so this removes the apt mirror from the path entirely.
      #
      # The image denies anonymous access by default, hence the explicit config; readiness is a
      # plain TCP connect, because `mosquitto_pub` came from mosquitto-clients and apt is what
      # we are removing. timeout-minutes on the step is the backstop for anything still hanging.
      - name: Start a local MQTT broker (anonymous)
        timeout-minutes: 5
        run: |
          docker run -d --name mosquitto-ci -p 1883:1883 eclipse-mosquitto:2 \
            sh -c 'printf "listener 1883 0.0.0.0\nallow_anonymous true\n" \
              > /mosquitto/config/mosquitto.conf \
              && exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf'
          for i in $(seq 1 30); do
            if python -c "import socket,sys; socket.create_connection(('localhost',1883),timeout=2).close()" \
                 2>/dev/null; then
              echo "broker up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MQTT broker did not come up on localhost:1883" >&2
          docker logs mosquitto-ci 2>&1 | tail -20 >&2
          exit 1

      # For the integration tests that write to and read from InfluxDB, which run once per server
      # (tests/integration/conftest.py). InfluxDB 1.8 with authentication off, started the same
      # way as the broker and for the same reasons.
      - name: Start a local InfluxDB
        timeout-minutes: 5
        run: |
          docker run -d --name influxdb-ci -p 8086:8086 influxdb:1.8
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8086/ping >/dev/null; then
              echo "InfluxDB up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "InfluxDB did not come up on localhost:8086" >&2
          docker logs influxdb-ci 2>&1 | tail -20 >&2
          exit 1

      # And InfluxDB 2.7, because the two versions take different paths through the code: 2.x
      # writes to /api/v2/write with a token and answers reads through its v1-compatible /query.
      # The token and password are generated for this run and masked, never written into the
      # repository; the token reaches the tests through the job environment.
      - name: Start a local InfluxDB 2
        timeout-minutes: 5
        run: |
          token=$(openssl rand -hex 32)
          password=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          echo "::add-mask::$password"
          docker run -d --name influxdb2-ci -p 8087:8086 \
            -e DOCKER_INFLUXDB_INIT_MODE=setup \
            -e DOCKER_INFLUXDB_INIT_USERNAME=ci \
            -e DOCKER_INFLUXDB_INIT_PASSWORD="$password" \
            -e DOCKER_INFLUXDB_INIT_ORG=ci \
            -e DOCKER_INFLUXDB_INIT_BUCKET=ci \
            -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN="$token" \
            influxdb:2.7
          for i in $(seq 1 60); do
            # Asked with the token, not /health: the server reports healthy before its first-run
            # setup has made the org and the token, and a test starting then fails on auth.
            if curl -sf -H "Authorization: Token $token" "http://localhost:8087/api/v2/orgs?org=ci" | grep -q '"name": *"ci"'; then
              echo "INFLUX2_TEST_TOKEN=$token" >> "$GITHUB_ENV"
              echo "InfluxDB 2 up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "InfluxDB 2 did not come up on localhost:8087" >&2
          docker logs influxdb2-ci 2>&1 | tail -20 >&2
          exit 1

      - name: Run integration tests
        timeout-minutes: 10
        env:
          MQTT_TEST_BROKER_HOST: localhost
          MQTT_TEST_BROKER_PORT: "1883"
          INFLUX_TEST_URL: http://localhost:8086
          INFLUX2_TEST_URL: http://localhost:8087
          INFLUX2_TEST_ORG: ci
        run: pytest -m integration -v

  flake8-run:
    # Runs flake8 as an alternative, faster(?) linter

    runs-on: [ubuntu-latest]

    name: Run flake8
    # 42s observed max.
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8

  mypy-run:
    # Static type check. Configured permissively (see pyproject.toml) since
    # the codebase is not fully type-hinted yet - this just keeps obvious
    # type errors from creeping in on code that does have hints.

    runs-on: [ubuntu-latest]

    name: Run mypy
    # 58s observed max.
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy toinflux sendtoinflux.py

  arm64-verify:
    # packaging/deb/build-deb.sh ships the .deb as Architecture: all (no separate per-arch
    # build) on the assumption that the app and every dependency has a working
    # pure-Python fallback for any optional compiled accelerator (PyYAML's/
    # charset-normalizer's C extensions are stripped post-install for exactly this
    # reason). This job builds and installs that same .deb on a real arm64 runner and
    # smoke-tests it, to catch a future dependency change that makes a compiled
    # extension load-bearing rather than optional. Runs on every push/PR (not gated
    # to main) and is a required status check, so a regression here blocks the merge
    # instead of only being noticed after it's already on main.
    runs-on: [ubuntu-24.04-arm]
    name: Verify .deb build on arm64
    # 148s observed max - builds the .deb and runs the scenario suite.
    timeout-minutes: 20
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

      - name: Ensure rsyslog and logrotate are present
        # Recommends:, not Depends: (see build-deb.sh) - typically present on
        # a full Ubuntu runner image already, but installed explicitly rather
        # than assumed, so the packaging scenario tests below (the
        # rsyslog/logrotate config) can't be silently skipped by a future
        # runner-image change.
        #
        # Retried: the arm64 ports mirror (ports.ubuntu.com) intermittently
        # advertises a security point-release in its Packages index before the
        # matching .deb is actually in the pool, so a single install can 404 on
        # an otherwise-valid version (transient, Ubuntu-side - the amd64/Debian
        # legs of the same build are unaffected). A plain apt-get update doesn't
        # help, since the index itself is the stale half; retrying picks up the
        # pool once it catches up rather than failing the whole run.
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update -q && sudo apt-get install -yq rsyslog logrotate; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "apt install attempt $attempt failed (likely a transient mirror 404); retrying in 15s..."
              sleep 15
            fi
          done
          echo "rsyslog/logrotate install still failing after 5 attempts" >&2
          exit 1

      - name: Build .deb package
        run: packaging/deb/build-deb.sh

      - name: Generate a random test secret for the Hue credential
        # Generated fresh and masked each run, rather than a fixed string
        # committed to the repo - avoids both a secret-scanning false positive
        # on a debconf `password`-typed field and printing a recognisable
        # constant in job logs (the `run:` script text itself is echoed to the
        # log, and so is the settings.yaml diff a later step reads back).
        run: |
          secret="ci-test-$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          echo "HUE_TEST_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Run the packaging scenario tests
        # packaging/deb/test-packaging.sh exercises the full install lifecycle
        # against the just-built .deb on this runner's real systemd: upgrade
        # over the latest published release (obsolete-conffile handover, no
        # re-prompts), fresh seeded install (Hue as the representative source -
        # one of each prompt type; InfluxDB identity/secret deliberately left
        # blank, since version detection against a real server is out of scope),
        # plain-upgrade silence over a hand-edited config, restart-on-upgrade
        # of a running service, dpkg-reconfigure semantics (stored credential
        # satisfies a blank secret prompt), per-source question visibility at
        # debconf's default priority, and purge (config, credentials, and
        # debconf answers all removed). Each assertion is behaviour that
        # regressed, or nearly regressed, at least once - see PR #48.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo -E bash packaging/deb/test-packaging.sh send-to-influx_*_all.deb

  bookworm-verify:
    # Same packaging scenario suite as arm64-verify, but inside a debian:12
    # container - systemd 252, the oldest systemd-creds this package supports
    # in practice (Raspberry Pi OS / Debian bookworm). The arm64 runner ships
    # systemd 255+, which silently masks older-systemd behaviour differences:
    # a real 4.1 regression (systemd-creds decrypt refusing un-named
    # credentials, because only >= 254 strips the ".cred" suffix when deriving
    # a name from the filename) passed CI and was only caught in the field on
    # a bookworm Pi. No systemd is *running* in the container, so the
    # restart-on-upgrade scenario self-skips - arm64-verify covers that; this
    # job exists for the systemd-creds *tooling* version coverage.
    runs-on: [ubuntu-latest]
    name: Verify .deb on Debian 12 (systemd 252)
    # 119s observed max - the same suite in a container.
    timeout-minutes: 20
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate a random test secret for the Hue credential
        # Same reasoning as arm64-verify's copy of this step.
        run: |
          secret="ci-test-$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          echo "HUE_TEST_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Build the .deb and run the packaging scenario tests in a debian:12 container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -e HUE_TEST_SECRET \
            -e GITHUB_TOKEN \
            debian:12 bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q >/dev/null
              apt-get install -yq python3 python3-venv python3-pip systemd adduser curl rsyslog logrotate >/dev/null
              systemd-creds --version | head -1
              cp -r /src /build && cd /build
              bash packaging/deb/build-deb.sh /tmp/test.deb >/dev/null
              bash packaging/deb/test-packaging.sh /tmp/test.deb
            '
