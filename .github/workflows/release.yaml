name: 'Release'
run-name: Release ${{ github.event.release.tag_name }}
permissions:
  contents: write

# Runs when a GitHub Release is *published* - drafting and publishing in the UI is
# this repo's release process (hand-written notes are always added on top of the
# generated ones there). Triggering on the release event rather than the tag push
# means: tags can be created for purposes other than releases without triggering a
# build, and the release this job uploads to is guaranteed to already exist - its
# id arrives in the event payload, so no release lookup (by tag or otherwise) is
# ever needed. That matters: during the 4.3 release, GitHub's releases/tags/{tag}
# lookup endpoint served 503s for an extended period, which `gh release upload
# <tag>` rendered as a bogus "release not found", failing the run.
on:
  release:
    types: [published]

jobs:

  build-and-release:
    runs-on: [ubuntu-latest]
    name: Build .deb and attach it to the release
    # tests, build and upload in one job; the widest budget because a slow registry or release upload must not be cut off mid-publish.
    # Note what this timeout does and does not buy: a job it kills reports
    # `conclusion: cancelled`, never `failure` and never `timed_out`, so on its own it
    # raises no workflow-failure notification and no failed-run sweep can see it. On a
    # workflow that runs unattended on `release: published`, that means a release could
    # quietly fail to complete. The `report-cancelled-as-failure` job below converts the
    # cancellation into a real failure so it is actually reported.
    timeout-minutes: 30
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

      - name: Run flake8
        run: flake8

      - name: Verify release tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$TAG_NAME" != "$pkg_version" ]; then
            echo "Release tag ${TAG_NAME} does not match pyproject.toml version ${pkg_version}"
            exit 1
          fi

      - name: Build .deb package
        run: packaging/deb/build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: send-to-influx-deb
          path: send-to-influx_*.deb

      - name: Attach .deb to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # The upload goes straight to the release-id endpoints using the id from
          # the event payload. A same-named asset (left by a previously-failed or
          # partial attempt) is replaced first. No retries by design: if this
          # fails (e.g. a GitHub outage), the error below reports it plainly and
          # the fix is to re-run the failed job once GitHub recovers - nothing is
          # ever half-created, and the .deb is also saved as a workflow artifact
          # by the step above, so it can be attached by hand in a pinch (as was
          # done for 4.3).
          for deb in send-to-influx_*.deb; do
            name="$(basename "$deb")"
            asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq "[.[] | select(.name == \"$name\")][0].id // empty")"
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
            gh api --method POST -H "Content-Type: application/vnd.debian.binary-package" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              --input "$deb" >/dev/null \
              || { echo "Failed to attach $name to release $TAG_NAME (id $RELEASE_ID) - re-run this job to retry"; exit 1; }
            echo "Attached $name to release $TAG_NAME (id $RELEASE_ID)"
          done

  # APT publishing note: the flat APT repo at https://apt.l337.org/ is no longer
  # published from this workflow. It's owned by https://github.com/L337-org/apt,
  # whose hourly aggregator pulls the .deb assets straight from this repo's GitHub
  # Releases - so attaching the .deb above is all this workflow needs to do.

  # A job killed by `timeout-minutes` ends as `cancelled`, not `failure`, so GitHub
  # raises no workflow-failure notification for it and anything sweeping for failed
  # runs never sees it. This workflow is the one place here where that really bites:
  # it runs unattended when a release is published, so nothing else would notice that
  # the .deb was never attached. This job turns the cancellation into a failure.
  #
  # Safe because this workflow declares no `concurrency` block, so nothing supersedes
  # it: the only routes to `cancelled` are the timeout and a human pressing cancel,
  # and both are worth reporting on a publish. `premerge.yaml` deliberately has no
  # equivalent - `cancel-in-progress: true` there cancels superseded runs as a matter
  # of course, and a cancelled premerge run blocks the merge in front of a human
  # anyway. Same guard, same reasoning, as the scheduled workflows in L337-org/apt.
  report-cancelled-as-failure:
    name: Report a cancelled release run as a failure
    needs: [build-and-release]
    if: always() && needs.build-and-release.result == 'cancelled'
    runs-on: ubuntu-latest
    # Only has to bound runner startup: this job emits an annotation and exits.
    timeout-minutes: 5
    steps:
      - name: Fail the run, because a cancellation would not notify
        run: |
          echo "::error::The build-and-release job ended as cancelled, which is the conclusion a timeout-minutes kill produces. Failing this run so the release notifies instead of silently not completing."
          exit 1
