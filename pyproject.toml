[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "send-to-influx"
version = "5.4"
description = "Collect smart-home and energy device metrics into InfluxDB, with an optional MCP server to query and control them through Claude"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/L337-org/send-to-influx"

[project.scripts]
send-to-influx = "sendtoinflux:main"
send-to-influx-set-credential = "toinflux.credential_cli:main"

[tool.setuptools]
py-modules = ["sendtoinflux"]

[tool.setuptools.packages.find]
include = ["toinflux*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.black]
line-length = 120
# Pinned to the minimum supported interpreter, never left to inference. Black otherwise picks a
# target from the syntax it finds and the interpreter running it - on this machine it inferred
# py315 while running on 3.14, warning on every invocation - so "formatted correctly" could
# differ between a developer's machine and CI, which is the one thing a formatter must not do.
# py310 also guarantees the output stays parseable on every version the project supports, which
# requires-python and the .deb's PYTHON_MIN_SUPPORTED_MINOR both put at 3.10.
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests (tests/integration/, marked `integration`) are excluded from the
# default run - they need a real external dependency (an MQTT broker) and are run
# explicitly with `pytest -m integration`. They also skip cleanly when the dependency is
# absent, so an explicit run without a broker is a skip, not a failure.
addopts = "--capture=sys -m 'not integration'"
markers = [
    "integration: exercises a real external dependency (e.g. a live MQTT broker); excluded from the default run",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false