[flake8]
# build/ is a local artefact - `pip install -e .` creates it, and CI's test job does too - so
# linting it means every finding is reported twice, once against the source and once against
# a copy nobody edits. It was never excluded; the docstring rules made that visible.
exclude = .git,__pycache__,venv,.venv,build
max-line-length = 120
max-complexity = 10
# E203 is whitespace before ':', which black produces; it is ignored permanently.
#
# No pydocstyle rule is ignored: its whole Google convention applies. The two things it does not
# reach - tests, and the tool docstrings that are themselves the advertised description - are
# exempted by name below, where the reason for each sits beside it.
#
# **There is no docstring backlog.** Every pydoclint code is enforced except DOC502 and DOC503,
# and those two are a decision rather than deferred work - see below. DOC101 and DOC103 are why
# the tool is here at all: a docstring that documents none of its parameters passes pydocstyle
# entirely, so pydocstyle alone cannot tell a complete docstring from an empty one.
#
# Two exemptions are per function rather than per code, because pydoclint has no way to express
# them in configuration. Both are asserted by tests/test_repo_hygiene.py so neither can rot:
#   - the registered tools carry `# noqa: DOC101,DOC103,DOC108,DOC201`, since their docstrings
#     are their advertised descriptions and the schema beside them already carries the
#     parameter types (CS.6.14);
#   - `scripts/check-repo-hygiene.py` is exempted by name in per-file-ignores, because it is
#     vendored byte-identically into four repositories.
#
# A procedure needs `-> None` on its signature, not a `Returns: None` in its docstring, which
# commit db66148 deliberately removed. pydoclint reads the annotation and stops asking.
#
# The counts are not recorded here because they move with every change and a stale number is
# worse than none. `flake8` on its own is the measurement now that nothing is ignored.
#
# DOC502 and DOC503 are not backlog - they are a decision, and they never come off. This package
# documents what a caller can catch, which includes exceptions raised by something it calls;
# pydoclint only sees exceptions constructed literally in the body, so it reads every propagated
# one as undocumented. Every finding was checked by hand against its raise site before this line
# was written, and all of them were of that kind: none was a stale entry. Two were not even
# propagation - `_post_line` does `exc = InfluxWriteError(...)` then `raise exc`, and
# `_atomic_write` re-raises bare after removing its temporary file - and pydoclint resolves
# neither to a type. DOC501, the direction that matters, is enforced: raise something and you
# must say so.
extend-ignore =
    E203,
    DOC502,
    DOC503
per-file-ignores =
    # imported but unused: F401
    __init__.py: F401
    # Tests are exempt from the docstring rules. CS.6 is about the code a reader of the
    # product meets; a test's name is its documentation, and the D102s here would all be pressure
    # to write "Test that X" above a method already called test_x.
    tests/*: D,DOC
    # check-repo-hygiene.py is vendored byte-identically into four repositories and checks itself
    # against the digest beside it, so its docstrings change in all four at once or not at all.
    # Several functions there raise CannotEvaluate without saying so. That is a real gap, not a
    # false positive, and it is exempted here only because this repository cannot fix it alone.
    # Clear it by adding the Raises sections in all four copies, regenerating each digest with
    # the command in the script's header, then deleting this line. DOC202 is on the same footing:
    # its one finding is in that file.
    scripts/check-repo-hygiene.py: DOC101,DOC103,DOC109,DOC110,DOC202,DOC501

# --- Docstrings (CS.6.12, CS.6.3) -------------------------------------------------------
#
# Google style, enforced here rather than by review, because a convention only reviewers
# enforce is one that drifts between reviewers.
docstring-convention = google

# A tool's docstring IS its advertised description - the MCP client loads it and a model reads
# it - so CS.6.14 puts it under the AI-consumer rules instead of these. A summary line ending in
# a full stop is not what that reader needs, and an `Args:` block would duplicate the parameter
# types the schema beside it already carries, charging for that duplication on every session
# that loads it. This exempts every @register_tool function from the D codes.
#
# A regex rather than a list of names, because flake8-docstrings matches the decorator
# expression - which for a decorator taking arguments is the whole call. Only `register_tool`
# is here: prompts and resources pass `description=` explicitly at registration, so their
# docstrings reach no client and there is nothing to trade off.
#
# It does NOT exempt the tools from pydoclint's DOC codes, and cannot: this is a
# flake8-docstrings option, and pydoclint 0.9.1 has no decorator-based exemption at all -
# passing `--ignore-decorators` to it is an unknown-option error. That half is done per function
# with `# noqa: DOC108` on each tool that carries signature type hints. DOC108 is enforced, so
# those markers are load-bearing rather than decorative - removing one fails the run. The same
# markers will need DOC101, DOC103, DOC109, DOC110 and DOC201 adding when those come off the
# backlog below, for the same reason.
#
# Both halves are asserted, so a renamed decorator or a stale marker fails rather than silently
# pulling the advertised descriptions into rules that are wrong for them:
#   tests/test_repo_hygiene.py::test_the_docstring_exemption_matches_the_decorators_in_use
#   tests/test_repo_hygiene.py::test_every_tool_with_signature_hints_is_exempted_from_doc108
ignore-decorators = (register_tool)

# pydoclint: does the docstring agree with the signature? pydocstyle cannot answer that - D417
# only checks the parameters of a section a docstring already has, so writing no `Args:` section
# passes it. These options describe this codebase rather than pydoclint's defaults:
#   style                          the same Google convention as above
#   skip-checking-short-docstrings a docstring with no sections counts as "short", and skipping
#                                  those is the default - which is exactly the case that hides a
#                                  function documenting no parameters at all, so it must be False
# Every option below was checked by flipping it and confirming the finding count moves; a
# pydoclint option that is not recognised is silently ignored, so "it is in the file" is not
# evidence that it applies. Note the names: `--arg-type-hints-in-*` are current, and
# `--type-hints-in-*` are the deprecated aliases, not the other way round.
#
#   arg-type-hints-in-signature    this code carries no annotations, so do not ask for them there
#   arg-type-hints-in-docstring    the convention puts the type in the docstring entry; DOC109 and
#                                  DOC110 are what will hold every entry to carrying one, once
#                                  they come off the backlog below
style = google
skip-checking-short-docstrings = False
arg-type-hints-in-signature = False
arg-type-hints-in-docstring = True
check-return-types = False
allow-init-docstring = True
check-yield-types = False
