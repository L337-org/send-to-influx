[flake8]
# build/ is a local artefact - `pip install -e .` creates it, and CI's test job does too - so
# linting it means every finding is reported twice, once against the source and once against
# a copy nobody edits. It was never excluded; the docstring rules made that visible.
exclude = .git,__pycache__,venv,.venv,build
max-line-length = 120
max-complexity = 10
# whitespace before ':': E203
#
# The D entries are the docstring backlog, in configuration where it is reviewable rather than
# in a planning document nothing enforces. This is the workflow pydocstyle documents for
# adopting a convention: select everything, ignore exactly what fails today, and remove entries
# along with the violations they name. That locks in the thirty-odd rules that already pass, so
# none of them can regress while the backlog is worked through.
#
# Group what goes in one change by how the fix is made rather than one rule per change. Several
# mechanical rules cost no more to review together than one, because the question is whether the
# fixer ran correctly; a rule needing judgement, such as where a summary ends, wants reading on
# its own.
#
# Counts, shipped code only, measured with `flake8 --extend-ignore=E203`:
#   D415 first line should end with a period          127
#   D205 blank line between summary and description    94
# Largest first, so the next one to take is obvious.
#
# ruff is a fixer here, never the authority: it counts 36 D415 where flake8 counts 127. Verify
# with flake8, and keep `scripts/check-repo-hygiene.py` out of any bulk fix - it is vendored
# byte-identically into four repositories against a shared digest.
extend-ignore =
    E203,
    D415,
    D205
per-file-ignores =
    # imported but unused: F401
    __init__.py: F401
    # Tests are exempt from the docstring rules. CS.6 is about the code a reader of the
    # product meets; a test's name is its documentation, and 490 D102s here would be pressure
    # to write "Test that X" above a method already called test_x.
    tests/*: D
    # The vendored hygiene script is byte-identical in four repositories and written in the
    # documented lowercase args:/returns: house style of the repository that owns it, which is
    # not Google - so D405 fires on every section. Excluded here rather than converted, since
    # converting it means changing all four copies and the digest they share. It clears when
    # docker-mcp's own gate clears D405.
    scripts/check-repo-hygiene.py: D

# --- Docstrings (CS.6.12, CS.6.3) -------------------------------------------------------
#
# Google style, enforced here rather than by review, because a convention only reviewers
# enforce is one that drifts between reviewers.
docstring-convention = google

# The MCP surface is NOT covered by these rules. A tool, prompt or resource docstring is the
# advertised interface a client loads and a model reads, so CS.6.14 hands it to the
# AI-consumer rules instead: it wants what the schema cannot already carry, and a structured
# parameter block duplicates what the schema has. Applying D417 to one would make it worse and
# charge for the duplication on every session that loads it.
#
# A regex rather than a list of names, because flake8-docstrings matches the decorator
# expression - which for a decorator taking arguments is the whole call. The names are
# asserted against the ones actually in use by
# tests/test_repo_hygiene.py::test_the_docstring_exemption_matches_the_decorators_in_use, so a
# renamed decorator fails rather than silently pulling sixteen advertised docstrings into rules
# that are wrong for them.
ignore-decorators = (register_tool|server\.prompt|_register_resource)
