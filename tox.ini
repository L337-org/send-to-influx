[flake8]
# build/ is a local artefact - `pip install -e .` creates it, and CI's test job does too - so
# linting it means every finding is reported twice, once against the source and once against
# a copy nobody edits. It was never excluded; the docstring rules made that visible.
exclude = .git,__pycache__,venv,.venv,build
max-line-length = 120
max-complexity = 10
# E203 is whitespace before ':', which black produces; it is ignored permanently. No docstring
# rule is ignored blanket-wide: the whole of pydocstyle's Google convention applies, and the two
# things it does not reach - tests, and the tool docstrings that are themselves the advertised
# description - are exempted by name below, where the reason for each sits beside it.
#
# The DOC entries are pydoclint's backlog, on the same terms as the D entries above: each
# names a check this code does not satisfy yet, and an entry comes off only with the change
# that fixes everything it names. Largest first.
#
#   DOC103 docstring arguments differ from the signature's                135
#   DOC101 docstring has fewer arguments than the signature               133
#   DOC201 returns a value with no Returns: section                       120
#   DOC110 no type in the docstring entry, and the convention says there should be 96
#   DOC109 no type in the signature, and the option says there should be  79
#   DOC503 raises exceptions the Raises: section does not name            40
#   DOC501 raises an exception with no Raises: section                    33
#   DOC601 class attributes not documented                                16
#   DOC603 class attribute names differ from the docstring's              16
#   DOC502 has a Raises: section for something it does not raise          16
#   DOC202 has a Returns: section but returns nothing                     15
#   DOC108 argument order differs from the docstring's own                7
#   DOC301 __init__ documents the class rather than the constructor       6
#   DOC104 argument order differs from the signature                      5
#   DOC402 yields with no Yields: section                                 2
#   DOC105 argument type differs from the signature                       2
#
# DOC101/DOC103 are the hole this tool was added for: a docstring that documents no
# parameters at all passes pydocstyle entirely, which is how these went unseen.
extend-ignore =
    E203,
    DOC101,
    DOC103,
    DOC104,
    DOC105,
    DOC108,
    DOC109,
    DOC110,
    DOC201,
    DOC202,
    DOC301,
    DOC402,
    DOC501,
    DOC502,
    DOC503,
    DOC601,
    DOC603
per-file-ignores =
    # imported but unused: F401
    __init__.py: F401
    # Tests are exempt from the docstring rules. CS.6 is about the code a reader of the
    # product meets; a test's name is its documentation, and 490 D102s here would be pressure
    # to write "Test that X" above a method already called test_x.
    tests/*: D,DOC

# --- Docstrings (CS.6.12, CS.6.3) -------------------------------------------------------
#
# Google style, enforced here rather than by review, because a convention only reviewers
# enforce is one that drifts between reviewers.
docstring-convention = google

# pydoclint: does the docstring agree with the signature? pydocstyle cannot answer that - D417
# only checks the parameters of a section a docstring already has, so writing no `Args:` section
# passes it. These options describe this codebase rather than pydoclint's defaults:
#   style                          the same Google convention as above
#   skip-checking-short-docstrings a docstring with no sections counts as "short", and skipping
#                                  those is the default - which is exactly the case that hid the
#                                  110 undocumented-parameter functions, so it must be False
#   arg-type-hints-in-signature    this code carries no annotations, which is why the convention
#                                  puts the type in the docstring entry instead
#   arg-type-hints-in-docstring    and requires it to be there
style = google
skip-checking-short-docstrings = False
arg-type-hints-in-signature = False
arg-type-hints-in-docstring = True
check-return-types = False
check-yield-types = False

# Tool docstrings are NOT covered by these rules. A tool docstring is the
# advertised interface a client loads and a model reads, so CS.6.14 hands it to the
# AI-consumer rules instead: it wants what the schema cannot already carry, and a structured
# parameter block duplicates what the schema has. Applying D417 to one would make it worse and
# charge for the duplication on every session that loads it.
#
# A regex rather than a list of names, because flake8-docstrings matches the decorator
# expression - which for a decorator taking arguments is the whole call. The names are
# asserted against the ones actually in use by
# tests/test_repo_hygiene.py::test_the_docstring_exemption_matches_the_decorators_in_use, so a
# renamed decorator fails rather than silently pulling the advertised descriptions into rules
# that are wrong for them. Only `register_tool` is here: a tool's docstring *is* its description
# and the schema beside it carries the parameter types, so an `Args:` block would duplicate what
# the client already has. Prompts and resources pass `description=` explicitly at registration,
# so their docstrings reach no client and there is nothing to trade off - the same guard fails
# if either is added back.
ignore-decorators = (register_tool)
