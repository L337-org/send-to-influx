[flake8]
# build/ is a local artefact - `pip install -e .` creates it, and CI's test job does too - so
# linting it means every finding is reported twice, once against the source and once against
# a copy nobody edits. It was never excluded; the docstring rules made that visible.
exclude = .git,__pycache__,venv,.venv,build
max-line-length = 120
max-complexity = 10
# E203 is whitespace before ':', which black produces; it is ignored permanently. No docstring
# rule is ignored: the whole of pydocstyle's Google convention is enforced here.
extend-ignore =
    E203
per-file-ignores =
    # imported but unused: F401
    __init__.py: F401
    # Tests are exempt from the docstring rules. CS.6 is about the code a reader of the
    # product meets; a test's name is its documentation, and 490 D102s here would be pressure
    # to write "Test that X" above a method already called test_x.
    tests/*: D

# --- Docstrings (CS.6.12, CS.6.3) -------------------------------------------------------
#
# Google style, enforced here rather than by review, because a convention only reviewers
# enforce is one that drifts between reviewers.
docstring-convention = google

# The MCP surface is NOT covered by these rules. A tool, prompt or resource docstring is the
# advertised interface a client loads and a model reads, so CS.6.14 hands it to the
# AI-consumer rules instead: it wants what the schema cannot already carry, and a structured
# parameter block duplicates what the schema has. Applying D417 to one would make it worse and
# charge for the duplication on every session that loads it.
#
# A regex rather than a list of names, because flake8-docstrings matches the decorator
# expression - which for a decorator taking arguments is the whole call. The names are
# asserted against the ones actually in use by
# tests/test_repo_hygiene.py::test_the_docstring_exemption_matches_the_decorators_in_use, so a
# renamed decorator fails rather than silently pulling sixteen advertised docstrings into rules
# that are wrong for them.
ignore-decorators = (register_tool|server\.prompt|_register_resource)
