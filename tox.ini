[flake8]
# build/ is a local artefact (`pip install -e .` and CI's test job both create it), so linting it
# reports every finding twice.
exclude = .git,__pycache__,venv,.venv,build
max-line-length = 120
max-complexity = 10

# E203 is whitespace before ':', which black produces.
#
# DOC502 and DOC503 are a decision, not a backlog: this package documents what a caller can
# catch, including what its callees raise, and pydoclint only sees exceptions constructed
# literally in the body. Do not "clear" them. DOC501 - raise something and say so - is enforced.
#
# To see what those two would flag: `flake8 --extend-ignore=E203`. That flag *replaces* this
# list; `--ignore=E203` does not, and reports zero.
extend-ignore =
    E203,
    DOC502,
    DOC503
per-file-ignores =
    # imported but unused: F401
    __init__.py: F401
    # A test's name is its documentation; D102 here is pressure to write "Test that X" above a
    # method already called test_x.
    tests/*: D,DOC

# --- Docstrings (CS.6.12, CS.6.3) -------------------------------------------------------
docstring-convention = google

# A tool's docstring is its advertised description, and the schema beside it already carries the
# parameter types, so CS.6.14 governs it instead of these rules. Exempting it takes two
# mechanisms: this option covers the D codes only, and pydoclint has no decorator-based
# exemption at all, so each tool also carries a `# noqa` marker for the DOC codes that apply to
# it. Both halves are asserted by tests/test_repo_hygiene.py; a stale marker fails the run.
#
# A regex, because flake8-docstrings matches the whole decorator call. Prompts and resources
# pass `description=` at registration, so their docstrings reach no client and are not exempt.
ignore-decorators = (register_tool)

# pydoclint checks the docstring against the signature, which pydocstyle cannot: D417 only checks
# the parameters of a section a docstring already has, so documenting none of them passes it.
#
# skip-checking-short-docstrings defaults to True and counts a sectionless docstring as short -
# which is exactly the case above, so it must be False or the tool reports nothing.
#
# This code carries no annotations, so types go in the docstring entry (DOC109/DOC110 enforce
# that) and not in the signature. The one exception is `-> None` on a procedure: that is what
# stops DOC201 asking for a `Returns: None`, which is not this project's form.
#
# `--arg-type-hints-in-*` are the current option names; `--type-hints-in-*` are the deprecated
# aliases, and an unrecognised pydoclint option is silently ignored.
style = google
skip-checking-short-docstrings = False
arg-type-hints-in-signature = False
arg-type-hints-in-docstring = True
check-return-types = False
allow-init-docstring = True
check-yield-types = False
